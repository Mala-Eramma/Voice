
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation History</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #e6f0ff;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: #e6f0ff;
            border-radius: 15px;
            border: 1px solid blue;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .result-box {
            background: #f8f9fa;
            padding: 12px 15px;
            margin: 12px auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow-wrap: anywhere;
        }

        .result-box p {
            margin: 5px 0;
            color: #666;
            font-size: 13px;
        }

        .result-box h3 {
            margin: 3px 0 8px;
            font-size: 18px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button,
        .history-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4f73df;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Calculation History</h1>

        <div id="history">Loading history...</div>

        <div class="button-container">
            <button onclick="clearHistory()">Clear History</button>
            <a href="/" class="history-button">Back to Calculator</a>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const container = document.getElementById("history");
            container.textContent = "Loading history...";

            try {
                const response = await fetch("/history");

                if (!response.ok) {
                    throw new Error("Could not load history");
                }

                const records = await response.json();
                container.replaceChildren();

                if (records.length === 0) {
                    container.textContent = "No history found";
                    return;
                }

                records.forEach(item => {
                    const box = document.createElement("div");
                    box.className = "result-box";

                    const expressionLabel = document.createElement("p");
                    expressionLabel.textContent = "Expression";

                    const expression = document.createElement("h3");
                    expression.textContent = item.expression;

                    const answerLabel = document.createElement("p");
                    answerLabel.textContent = "Answer";

                    const answer = document.createElement("h3");
                    answer.textContent = item.answer;

                    const date = document.createElement("p");
                    date.textContent = item.created_at || "";

                    box.append(
                        expressionLabel,
                        expression,
                        answerLabel,
                        answer,
                        date
                    );

                    container.appendChild(box);
                });
            } catch (error) {
                console.error(error);
                container.textContent = "Unable to load calculation history.";
            }
        }

        async function clearHistory() {
            if (!confirm("Do you want to delete all history?")) {
                return;
            }

            try {
                const response = await fetch("/history", {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Could not clear history");
                }

                await loadHistory();
            } catch (error) {
                console.error(error);
                alert("Unable to clear history. Please try again.");
            }
        }

        loadHistory();
    </script>
</body>
</html>
