<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculation History</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:#e6f0ff;
        }

        .container {
            width: 70%;
            max-width: 750px;
            margin: 50px auto;
            padding: 30px;
            background:#e6f0ff;
            border-radius: 15px;
            border:1px solid blue;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #history {
            margin-bottom: 25px;
        }

        #history .result-box {
            width: 40%;
            background: #f8f9fa;
            padding: 10px 15px;
            margin:0 auto 10px auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        #history .result-box p {
            margin: 5px 0;
            color: #666;
            font-size: 13px;
        }

        #history .result-box h3 {
            margin: 3px 0 8px;
            font-size: 18px;
        }

        #history .result-box p:last-child {
            font-size: 12px;
            color: #888;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color:#4f73df;
            color: white;
        }

        .history-button {
            display: inline-block;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            background-color: #4f73df;
            color: white;
        }
        .button-container{
            width:100%;
            display:flex;
            justify-content: center;
            align-items: center;
            gap:10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Calculation History</h1>

        <div id="history">
            Loading...
        </div>
        <div class="button-container">
        <button onclick="clearHistory()">
            Clear History
        </button>

        <a href="/static/index.html" class="history-button">
            Back to Calculator
        </a>
        </div>

    </div>


    <script>

        function loadHistory() {

            const history = document.getElementById("history");

            const data = JSON.parse(
                localStorage.getItem("calculatorHistory") || "[]"
            );

            history.innerHTML = "";


            if (data.length === 0) {

                history.innerHTML = "<p>No history found</p>";

                return;
            }


            data.forEach(item => {

                const div = document.createElement("div");

                div.className = "result-box";

                div.innerHTML = `
                    <p>Expression</p>
                    <h3>${item.expression}</h3>

                    <p>Answer</p>
                    <h3>${item.answer}</h3>

                    <p>${item.created_at}</p>
                `;

                history.appendChild(div);

            });
        }


        function clearHistory() {

            const confirmDelete = confirm(
                "Do you want to delete all history?"
            );

            if (!confirmDelete) {
                return;
            }

            localStorage.removeItem("calculatorHistory");

            loadHistory();
        }


        loadHistory();

    </script>

</body>

</html>
