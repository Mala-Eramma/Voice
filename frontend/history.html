
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation History</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #e6f0ff;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: #e6f0ff;
            border-radius: 15px;
            border: 1px solid blue;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #183b80;
        }

        .result-box {
            background: #f8f9fa;
            padding: 12px 15px;
            margin: 12px auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow-wrap: anywhere;
        }

        .result-box p {
            margin: 5px 0;
            color: #666;
            font-size: 13px;
        }

        .result-box h3 {
            margin: 3px 0 8px;
            font-size: 18px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button, .history-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #183b80;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        button:hover, .history-button:hover {
            background: #315bb0;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Calculation History</h1>

        <div id="history"></div>

        <div class="button-container">
            <button id="clearButton">Clear History</button>
            <a href="index.html" class="history-button">Back to Calculator</a>
        </div>
    </div>

    <script>
        function loadHistory() {
            const container = document.getElementById("history");
            const records = JSON.parse(
                localStorage.getItem("voiceHistory") || "[]"
            );

            container.replaceChildren();

            if (records.length === 0) {
                const message = document.createElement("p");
                message.className = "empty-message";
                message.textContent = "No calculation history found.";
                container.appendChild(message);
                return;
            }

            records.forEach(item => {
                const box = document.createElement("div");
                box.className = "result-box";

                const expressionLabel = document.createElement("p");
                expressionLabel.textContent = "Expression";

                const expression = document.createElement("h3");
                expression.textContent = item.expression;

                const answerLabel = document.createElement("p");
                answerLabel.textContent = "Answer";

                const answer = document.createElement("h3");
                answer.textContent = item.answer;

                const date = document.createElement("p");
                date.textContent = item.created_at || "";

                box.append(
                    expressionLabel,
                    expression,
                    answerLabel,
                    answer,
                    date
                );

                container.appendChild(box);
            });
        }

        document.getElementById("clearButton").addEventListener("click", () => {
            if (confirm("Do you want to delete all history?")) {
                localStorage.removeItem("voiceHistory");
                loadHistory();
            }
        });

        loadHistory();
    </script>
</body>
</html>
